<div class="max-w-3xl mx-auto bg-white p-6 rounded-lg shadow-lg">
    <h2 class="text-xl font-semibold text-gray-700 mb-4">Demo School 001</h2>
  
    <div class="flex items-center mb-4">
      <div class="w-20 h-20 bg-gray-200 rounded-md flex items-center justify-center text-gray-600 font-bold text-lg">Avatar</div>
      <div class="ml-4">
        <button class="bg-white border border-blue-500 text-blue-500 px-3 py-1 rounded hover:bg-blue-100 mb-2">Choose Avatar</button>
        <button class="bg-blue-500 text-white px-3 py-1 rounded hover:bg-blue-600">Upload Picture</button>
      </div>
    </div>
  
    <div class="grid grid-cols-2 gap-4 mb-4">
      <input type="text" placeholder="Mr" class="input">
      <input type="text" placeholder="First Name" class="input">
      <input type="text" placeholder="Last Name" class="input col-span-2">
    </div>
  
    <div class="grid grid-cols-2 gap-4 mb-4">
      <input type="text" placeholder="Username" class="input col-span-2">
      <div>
        <p class="text-sm text-gray-600 mb-1">Or choose from one below</p>
        <div class="flex flex-wrap gap-2">
          <span class="text-sm text-gray-700">user-x993</span>
          <span class="text-sm text-gray-700">user-x123</span>
          <span class="text-sm text-gray-700">user-x723</span>
          <span class="text-sm text-gray-700">usr-1234</span>
          <span class="text-sm text-gray-700">usr-x723</span>
          <span class="text-sm text-gray-700">txle-xq99</span>
        </div>
      </div>
    </div>
  
    <div class="grid grid-cols-2 gap-4 mb-4">
      <input type="text" placeholder="Street Address" class="input">
      <input type="text" placeholder="Town/City" class="input">
      <input type="text" placeholder="Postcode" class="input">
      <input type="text" placeholder="Contact Number" class="input">
      <input type="email" placeholder="Email Address" class="input">
      <input type="text" placeholder="Designation" class="input">
    </div>
  
    <div class="flex justify-end gap-4">
      <button class="bg-gray-400 text-white px-4 py-2 rounded hover:bg-gray-500">Close</button>
      <button class="bg-green-500 text-white px-4 py-2 rounded hover:bg-green-600">Add User</button>
    </div>
  </div>
