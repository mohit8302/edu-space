<div class="min-h-screen flex items-center justify-center bg-gray-100">
  <form (ngSubmit)="onSubmit()" class="w-full max-w-sm p-6 bg-white rounded-2xl shadow-lg">

    <div class="flex justify-center mb-6">
      <img src="assets/images/logo.png" alt="logo" class="h-16 w-auto">
    </div>


    <!-- Username Input -->
    <div class="mb-4">
      
      <input type="text" name="username" [(ngModel)]="user.username" placeholder="Username" required
             class="appearance-none border border-gray-300 rounded-lg w-full py-3 px-4 text-gray-700 leading-tight focus:outline-none focus:ring-2 focus:ring-blue-400 focus:border-transparent">
    </div>

    <!-- Email Input -->
    <div class="mb-4">
      
      <input type="email" name="email" [(ngModel)]="user.email" placeholder="Email" required
             class="appearance-none border border-gray-300 rounded-lg w-full py-3 px-4 text-gray-700 leading-tight focus:outline-none focus:ring-2 focus:ring-blue-400 focus:border-transparent">
    </div>

    <!-- Password Input -->
    <div class="mb-6">
      <input type="password" name="password" [(ngModel)]="user.password" placeholder="Password" required
             class="appearance-none border border-gray-300 rounded-lg w-full py-3 px-4 text-gray-700 leading-tight focus:outline-none focus:ring-2 focus:ring-blue-400 focus:border-transparent">
    </div>

    <!-- Signup Button -->
    <div class="flex items-center justify-between mb-4">
      <button type="submit"
              class="w-full bg-blue-500 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg focus:outline-none focus:shadow-outline transition duration-300">
        Signup
      </button>
    </div>

    <!-- Error Message -->
    <div *ngIf="errorMessage" class="text-red-500 text-sm text-center mb-4">
      {{ errorMessage }}
    </div>

    <!-- Redirect to Login -->
    <div class="text-center">
      <p class="text-gray-600 text-sm">
        Already have an account? 
        <a routerLink="/login" class="text-blue-500 hover:text-blue-700 font-bold">Log in</a>
      </p>
    </div>

  </form>
</div>
