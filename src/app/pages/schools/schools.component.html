 
 <h1 class="text-"><b>School Management</b>

 </h1><div class="flex h-screen bg-gray-100">
  
  <div class="w-64 bg-white p-4 shadow-md rounded-md mt-4 ml-4">
    <button class="w-full bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded mb-4">+ Add New School</button>

    <div class="mb-6">
      <h5 class="text-gray-500 font-bold text-sm mb-2">School Configuration</h5>
      <ul class="space-y-2">
        <li class="cursor-pointer">
          <a [routerLink]="['/schools']" class="flex items-center p-2 rounded-md hover:bg-gray-200">
            <mat-icon fontIcon="settings" class="text-gray-600 mr-2"></mat-icon>
            <h4 class="text-gray-800 font-normal">General Settings</h4>
          </a>
        </li>
        <li class="cursor-pointer">
          <a [routerLink]="['communication']" class="flex items-center p-2 rounded-md hover:bg-gray-200">
            <mat-icon fontIcon="send" class="text-gray-600 mr-2"></mat-icon>
            <h4 class="text-gray-800 font-normal">Communications</h4>
          </a>
        </li>
      </ul>
    </div>

    <div class="mb-6">
      <h5 class="text-gray-500 font-bold text-sm mb-2">Groups</h5>
      <ul class="space-y-2">
        <li class="cursor-pointer">
          <a [routerLink]="['drafts']" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" class="flex items-center p-2 rounded-md hover:bg-gray-200">
            <mat-icon fontIcon="edit" class="text-gray-600 mr-2"></mat-icon>
            <h4 class="text-gray-800 font-normal">Drafts</h4>
          </a>
        </li>
        <li class="cursor-pointer">
          <a [routerLink]="['/inactive']" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" class="flex items-center p-2 rounded-md hover:bg-gray-200">
            <mat-icon fontIcon="warning" class="text-gray-600 mr-2"></mat-icon>
            <h4 class="text-gray-800 font-normal">Inactive</h4>
          </a>
        </li>
        <li class="cursor-pointer">
          <a [routerLink]="['/delete']" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" class="flex items-center p-2 rounded-md hover:bg-gray-200">
            <mat-icon fontIcon="delete" class="text-gray-600 mr-2"></mat-icon>
            <h4 class="text-gray-800 font-normal">Deleted</h4>
          </a>
        </li>
      </ul>
    </div>

    <div>
      <h5 class="text-gray-500 font-bold text-sm mb-2">Label</h5>
      <ul class="space-y-2">
        <li class="flex items-center">
          <input type="checkbox" id="primary" name="label" value="primary" class="hidden peer">
          <label for="primary" class="flex items-center cursor-pointer">
            <span class="w-4 h-4 rounded-md bg-blue-500 mr-2 peer-checked:bg-blue-700"></span>
            <span class="text-gray-800 text-sm">Primary</span>
          </label>
        </li>
        <li class="flex items-center">
          <input type="checkbox" id="social" name="label" value="social" class="hidden peer">
          <label for="social" class="flex items-center cursor-pointer">
             <span class="w-4 h-4 rounded-md bg-purple-500 mr-2 peer-checked:bg-purple-700"></span>
            <span class="text-gray-800 text-sm">Social</span>
          </label>
        </li>
        <li class="flex items-center">
          <input type="checkbox" id="work" name="label" value="work" class="hidden peer">
          <label for="work" class="flex items-center cursor-pointer">
             <span class="w-4 h-4 rounded-md bg-yellow-500 mr-2 peer-checked:bg-yellow-700"></span>
            <span class="text-gray-800 text-sm">Work</span>
          </label>
        </li>
        <li class="flex items-center">
          <input type="checkbox" id="friends" name="label" value="friends" class="hidden peer">
          <label for="friends" class="flex items-center cursor-pointer">
             <span class="w-4 h-4 rounded-md bg-red-500 mr-2 peer-checked:bg-red-700"></span>
            <span class="text-gray-800 text-sm">Friends</span>
          </label>
        </li>
      </ul>
    </div>

  </div>

  <div class="flex-1 bg-white p-6 rounded-md mt-4 mr-4 ">
    <router-outlet></router-outlet>
  </div>

</div>
