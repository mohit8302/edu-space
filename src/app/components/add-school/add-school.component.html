<div class="max-w-[738px] mx-auto bg-white shadow-md rounded">
    <div class="flex justify-between items-center border-b border-[#ECECEC] p-2 rounded-t">
        <h2 class="text-[24px] text-[#ADADAD] font-bold">Add New School</h2>
        <button class="text-gray-600 hover:text-gray-900">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="#ADADAD">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
            </svg>
        </button>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-4 gap-2 p-4">
        <div class="col-span-1 flex flex-col items-center py-4 rounded">
            <img src="assets/logo.png" alt="Logo" class="w-[100px] h-[90px] mb-4">
            <button
                class="bg-white border border-blue-500 text-blue-500 text-[8px] py-1 px-2 rounded-full mb-2 w-[80px] h-[20px] text-nowrap">Choose
                Avatar</button>
            <button class="bg-blue-500 text-white text-[8px] py-1 px-2 rounded-full mb-4 w-[80px] h-[20px]">Upload
                Image</button>
            <span class="text-[15px] justify-start mb-1 font-[600] text-[#959595]">Theme Color</span>
            <div class="flex space-x-2">
                <button class="w-[28px] h-[30px] bg-[#CBCBCB] rounded text-white font-semibold">P</button>
                <button class="w-[28px] h-[30px] bg-[#CBCBCB] rounded text-white font-semibold">S</button>
                <button class="w-[28px] h-[30px] bg-[#CBCBCB] rounded text-white font-semibold">T</button>
            </div>
        </div>
        <div class="col-span-1 md:col-span-3 bg-white p-4 rounded">
            <form (ngSubmit)="onSubmit(schoolForm)" #schoolForm="ngForm">
                <div class="mb-4">
                    <input type="text" id="name" required [(ngModel)]="school.name" name="name" #name="ngModel"
                        class="border-[#D1D1D1] border rounded w-full h-[71px] py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline text-left"
                        placeholder="School Name">
                    <div *ngIf="name.invalid && (name.dirty || name.touched)" class="text-red-500 text-xs italic">
                        <div *ngIf="name.errors?.['required']">
                            School name is required.
                        </div>
                    </div>
                </div>

                <div class="mb-4">
                    <input type="text" id="address" required [(ngModel)]="school.aboutschool" name="aboutschool"
                        #address="ngModel"
                        class="border-[#D1D1D1] border rounded w-full h-[132px] py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline text-left"
                        placeholder="About the School">
                    <div *ngIf="address.invalid && (address.dirty || address.touched)"
                        class="text-red-500 text-xs italic">
                        <div *ngIf="address.errors?.['required']">
                            Address is required.
                        </div>
                    </div>
                </div>



            </form>
        </div>
        <div class="col-span-1 md:col-span-2 bg-white p-4 rounded">
            <form (ngSubmit)="onSubmit(schoolForm)" #schoolForm="ngForm">
                <div class="mb-4">
                    <span class="text-[15px] justify-start mb-1 font-[400] text-[#959595]">Enter you preferred Username
                        for <span class=" font-bold text-[#959595]"> Admin</span></span>
                    <input type="text" id="name" required [(ngModel)]="school.username" name="username" #name="ngModel"
                        class="border-[#D1D1D1] border rounded w-full h-[47px] py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline text-left"
                        placeholder="User Name">
                    <div *ngIf="name.invalid && (name.dirty || name.touched)" class="text-red-500 text-xs italic">
                        <div *ngIf="name.errors?.['required']">
                            School name is required.
                        </div>
                    </div>
                </div>
            </form>
        </div>
        <div class="col-span-1 md:col-span-2 bg-white p-4 rounded">
            <form (ngSubmit)="onSubmit(schoolForm)" #schoolForm="ngForm">
                <div class="mb-4">
                    <span class="text-[15px] justify-start mb-1 font-[400] text-[#959595]">Enter you preferred Username
                        for <span class=" font-bold text-[#959595]"> Admin</span></span>
                    <input type="text" id="name" required [(ngModel)]="school.username" name="username" #name="ngModel"
                        class="border-[#D1D1D1] border rounded w-full h-[47px] py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline text-left"
                        placeholder="User Name">
                    <div *ngIf="name.invalid && (name.dirty || name.touched)" class="text-red-500 text-xs italic">
                        <div *ngIf="name.errors?.['required']">
                            School name is required.
                        </div>
                    </div>
                </div>
            </form>
        </div>
        <div class="col-span-1 md:col-span-2 bg-white p-4 rounded">
            <form (ngSubmit)="onSubmit(schoolForm)" #schoolForm="ngForm">
                <div class="mb-4">
                    <span class="text-[15px] justify-start mb-2 font-[400] text-[#959595]">Details</span>
                    <input type="text" id="name" required [(ngModel)]="school.streetaddress" name="StreetAddress"
                        #name="ngModel"
                        class="border-[#D1D1D1] border rounded w-full h-[47px] py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline text-left"
                        placeholder="Street Address">
                    <div *ngIf="name.invalid && (name.dirty || name.touched)" class="text-red-500 text-xs italic">
                        <div *ngIf="name.errors?.['required']">
                            Street address is required.
                        </div>
                    </div>
                </div>
                <div class="mb-4">

                    <input type="text" id="name" required [(ngModel)]="school.postcode" name="Post Code" #name="ngModel"
                        class="border-[#D1D1D1] border rounded w-full h-[47px] py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline text-left"
                        placeholder="Post Code">
                    <div *ngIf="name.invalid && (name.dirty || name.touched)" class="text-red-500 text-xs italic">
                        <div *ngIf="name.errors?.['required']">
                            post code is required.
                        </div>
                    </div>
                </div>
                <div class="mb-4">

                    <input type="text" id="name" required [(ngModel)]="school.email" name="email" #name="ngModel"
                        class="border-[#D1D1D1] border rounded w-full h-[47px] py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline text-left"
                        placeholder="Email Address">
                    <div *ngIf="name.invalid && (name.dirty || name.touched)" class="text-red-500 text-xs italic">
                        <div *ngIf="name.errors?.['required']">
                            Email is required.
                        </div>
                    </div>
                </div>

            </form>
        </div>

    </div>
</div>
