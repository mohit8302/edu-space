<div class="max-w-[738px] mx-auto bg-white shadow-md rounded">
    <div class="flex justify-between items-center border-b border-[#ECECEC] p-2 rounded-t">
        <h2 class="text-[24px] md:text-[24px] text-[#ADADAD] font-bold">Add New School</h2>
        <button class="text-gray-600 hover:text-gray-900">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 md:h-6 md:w-6" fill="none" viewBox="0 0 24 24"
                stroke="#ADADAD">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
            </svg>
        </button>
    </div>

    <form (ngSubmit)="onSubmit(schoolForm)" #schoolForm="ngForm">
        <div class="grid grid-cols-1 md:grid-cols-4 gap-2 p-4 border-b border-[#ECECEC]">
            <div class="col-span-1 flex flex-col items-center py-4 rounded">
                <img src="assets/logo.png" alt="Logo" class="w-[80px] h-[70px] md:w-[100px] md:h-[90px] mb-4">
                <button
                    class="bg-white border border-blue-500 text-blue-500 text-[6px] md:text-[8px] py-1 px-2 rounded-full mb-2 w-[60px] h-[15px] md:w-[80px] md:h-[20px] text-nowrap">Choose
                    Avatar</button>
                <button
                    class="bg-blue-500 text-white text-[6px] md:text-[8px] py-1 px-2 rounded-full mb-4 w-[60px] h-[15px] md:w-[80px] md:h-[20px]">Upload
                    Image</button>
                <span class="text-[12px] md:text-[15px] justify-start mb-1 font-[600] text-[#959595]">Theme Color</span>
                <div class="flex space-x-2">
                    <button
                        class="w-[20px] h-[25px] md:w-[28px] md:h-[30px] bg-[#CBCBCB] rounded text-white font-semibold">P</button>
                    <button
                        class="w-[20px] h-[25px] md:w-[28px] md:h-[30px] bg-[#CBCBCB] rounded text-white font-semibold">S</button>
                    <button
                        class="w-[20px] h-[25px] md:w-[28px] md:h-[30px] bg-[#CBCBCB] rounded text-white font-semibold">T</button>
                </div>
            </div>

            <div class="col-span-3 bg-white p-4 rounded">
                <div class="mb-4">
                    <input type="text" id="name" required [(ngModel)]="school.name" name="name" #name="ngModel"
                        class="border-[#D1D1D1] border rounded w-full h-[50px] md:h-[71px] py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline text-left"
                        placeholder="School Name">
                    <div *ngIf="name.invalid && (name.dirty || name.touched)" class="text-red-500 text-xs italic">
                        <div *ngIf="name.errors?.['required']">
                            School name is required.
                        </div>
                    </div>
                </div>

                <div class="mb-4">
                    <textarea id="about" required [(ngModel)]="school.about" name="about" #about="ngModel"
                        class="border-[#D1D1D1] border rounded w-full h-[100px] md:h-[132px] py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline text-left"
                        placeholder="About the School"></textarea>
                    <div *ngIf="about.invalid && (about.dirty || about.touched)" class="text-red-500 text-xs italic">
                        <div *ngIf="about.errors?.['required']">
                            About the school is required.
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-2 p-4 border-b border-[#ECECEC]">
            <div class="col-span-1 md:col-span-2 grid grid-cols-subgrid gap-2">
                <div class="mb-4">
                    <input type="text" id="username" required [(ngModel)]="school.username" name="username"
                        #username="ngModel"
                        class="border-[#D1D1D1] border rounded w-full h-[35px] md:h-[47px] py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline text-left"
                        placeholder="Username">
                    <div *ngIf="username.invalid && (username.dirty || username.touched)"
                        class="text-red-500 text-xs italic">
                        <div *ngIf="username.errors?.['required']">
                            Username is required.
                        </div>
                    </div>
                </div>

                <div class="mb-4">
                    <input type="text" id="address" required [(ngModel)]="school.address" name="address"
                        #address="ngModel"
                        class="border-[#D1D1D1] border rounded w-full h-[35px] md:h-[47px] py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline text-left"
                        placeholder="Address">
                    <div *ngIf="address.invalid && (address.dirty || address.touched)"
                        class="text-red-500 text-xs italic">
                        <div *ngIf="address.errors?.['required']">
                            Address is required.
                        </div>
                    </div>
                </div>

                <div class="mb-4">
                    <input type="text" id="city" required [(ngModel)]="school.city" name="city" #city="ngModel"
                        class="border-[#D1D1D1] border rounded w-full h-[35px] md:h-[47px] py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline text-left"
                        placeholder="City">
                    <div *ngIf="city.invalid && (city.dirty || city.touched)" class="text-red-500 text-xs italic">
                        <div *ngIf="city.errors?.['required']">
                            City is required.
                        </div>
                    </div>
                </div>

                <div class="mb-4">
                    <input type="text" id="postcode" required [(ngModel)]="school.postcode" name="postcode"
                        #postcode="ngModel"
                        class="border-[#D1D1D1] border rounded w-full h-[35px] md:h-[47px] py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline text-left"
                        placeholder="Postcode">
                    <div *ngIf="postcode.invalid && (postcode.dirty || postcode.touched)"
                        class="text-red-500 text-xs italic">
                        <div *ngIf="postcode.errors?.['required']">
                            Postcode is required.
                        </div>
                    </div>
                </div>

                <div class="mb-4">
                    <input type="text" id="contact_number" required [(ngModel)]="school.contact_number"
                        name="contact_number" #contact_number="ngModel"
                        class="border-[#D1D1D1] border rounded w-full h-[35px] md:h-[47px] py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline text-left"
                        placeholder="Contact Number">
                    <div *ngIf="contact_number.invalid && (contact_number.dirty || contact_number.touched)"
                        class="text-red-500 text-xs italic">
                        <div *ngIf="contact_number.errors?.['required']">
                            Contact number is required.
                        </div>
                    </div>
                </div>

                <div class="mb-4">
                    <input type="email" id="email" required [(ngModel)]="school.email" name="email" #email="ngModel"
                        class="border-[#D1D1D1] border rounded w-full h-[35px] md:h-[47px] py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline text-left"
                        placeholder="Email Address">
                    <div *ngIf="email.invalid && (email.dirty || email.touched)" class="text-red-500 text-xs italic">
                        <div *ngIf="email.errors?.['required']">
                            Email is required.
                        </div>
                    </div>
                </div>

                <div class="mb-4">
                    <input type="text" id="country" required [(ngModel)]="school.country" name="country"
                        #country="ngModel"
                        class="border-[#D1D1D1] border rounded w-full h-[35px] md:h-[47px] py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline text-left"
                        placeholder="Country">
                    <div *ngIf="country.invalid && (country.dirty || country.touched)"
                        class="text-red-500 text-xs italic">
                        <div *ngIf="country.errors?.['required']">
                            Country is required.
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="flex flex-wrap justify-end items-center gap-3 p-4">
            <button type="submit"
                class="bg-[#00B69B] cursor-pointer font-[900] text-white text-[12px] md:text-[15px] py-2 px-4 lg:w-[158px] rounded-lg text-nowrap">Create
                Account</button>
        </div>
    </form>
</div>
